      ##### Avoid
      - Model-specific accessories requiring exact product match
      - Random products with no functional or style link
      - Competing ecosystems
      - Different lifestyle domains

      ---

      ### 3. Deduplication & Diversity (applies across ALL journey types)

      These rules apply globally — across explicit AND related journeys as one unified set.

      #### Base Category Deduplication (Single Rule)

      - Two journeys are considered duplicates if they target the **same base product category**, even if they differ by brand, subtype, feature, or use case.
      - At most ONE journey is allowed per base product category across all types.
      - If multiple journeys target the same base category, keep the one with the strongest signal and discard the rest.
      - When multiple brands exist for a category (e.g., Nike and Adidas for running shoes), cover them through **multi-brand queries within a single journey** rather than creating separate journeys.
      - Before generating ANY journey, verify it does not overlap with ANY existing journey. Two journeys are too similar if they target the same product category, the same use case, or would surface substantially similar products.

      #### Quality

      - Each journey should represent a meaningful shopping decision.
      - Avoid trivial, disposable, or commodity items.
      - Explicit journeys must align with the user's event-based interests.
      - Related journeys must provide genuine complementary value to their parent journey.

      #### Journey Count

      The number of generated journeys should reflect the diversity of the user's interests in `<USER-EVENTS>`. Count all **distinct base product categories** from events.
      - 1 distinct category → generate 1 explicit journey + 1–2 related journeys
      - 2 distinct categories → generate 2–3 explicit journeys + 1–3 related journeys
      - 3+ distinct categories → generate up to 20 total journeys (explicit + related)
      - Maximum total journeys (all types combined): **20**

      Do NOT force additional journeys if the user's interests are highly concentrated. Quality and relevance are more important than quantity.

      ---

      ### Execution Steps

      **Pre-Phase: Category Inventory (MANDATORY — do this BEFORE generating any journeys)**

      Before writing any journeys, systematically scan ALL events in `<USER-EVENTS>` to build a complete category inventory:

      1. Scan every event and classify it into a **base product category** (e.g., "women's blouses/tops", "women's dresses", "petite pants", "chandeliers", "sneakers", "earrings", "clutches/handbags").
      2. Skip events that fail the safety filter, lack shopping intent, or are non-product pages (landing pages, homepages, promo banners).
      3. For each category, record:
        - Number of events (signal strength)
        - Most recent event time (recency)
        - Key attributes observed (brands, styles, features, retailers)
      4. Sort categories by: **(a)** recency of most recent event, then **(b)** number of events (strength).
      5. This sorted list is your **category checklist**. Every category on this list MUST receive an explicit journey in Phase 1 — do NOT skip any category, even those with only 1-2 events. A single Clicked event is a valid signal.

      **Phase 1 — Generate Explicit Journeys (iterate through the category checklist):**

      6. Walk through the category checklist from Step 4 **one by one**. For each category:
        a. Extract the key attributes (brands, styles, fits, retailers) from its events.
        b. Apply gender per §Gender Rules.
        c. Generate ONE explicit journey for this category.
        d. If multiple brands exist for the same category, merge them into multi-brand queries within the single journey.
      7. Apply safety filters across all explicit journeys.
      8. Apply `<SYSTEM-TIME>` seasonal filter across ALL explicit journeys:
        - Boost journeys that are seasonally relevant to the current date (e.g., winter coats in December, outdoor furniture in spring, swimwear in summer, back-to-school items in August).
        - Deprioritize or drop journeys tied to past seasons or events that have clearly passed (e.g., swimwear interest in December → deprioritize; Christmas decorations in February → drop).
        - Use seasonal relevance as a ranking factor in the next step.
      9. Rank explicit journeys by: seasonal relevance (from Step 8), intent recency, intent strength, and evidence support.
      10. **Coverage check**: Compare the finalized explicit journey list against the category checklist from Step 4. If any category was accidentally omitted, add it now. Every category in the checklist must have a corresponding journey.
      11. Finalize the explicit journey list.

      **Phase 2 — Generate Related Journeys (only after Phase 1 is finalized):**

      12. For each explicit journey, identify companion product categories that genuinely complement it.
      13. Propagate key attributes from the parent journey (brand ecosystem, style, gender, activity context, formality).
      14. Verify each related journey does not duplicate any existing journey (explicit or related).
      15. Ensure each related journey adds real functional or experiential value.
      16. Skip the related journey if it would be weak, generic, model-specific, or from a competing ecosystem.
      17. Record the parent journey in the Reason field.

